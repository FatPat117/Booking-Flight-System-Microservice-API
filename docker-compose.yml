# Dev topology: app + flight-notifier + RabbitMQ + Postgres (identity_db +
# booking_db — one container, two separate logical databases; see
# docker/postgres-init).

services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BOOKING_POSTGRES_USER: ${BOOKING_POSTGRES_USER:-booking}
      BOOKING_POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD:-booking_dev_password}
    # Day 40 added this after a RabbitMQ restart left the app stuck. Day 41
    # made the publisher reconnect in-process, so a broker restart no longer
    # needs it — it stays for any other unexpected crash (matches
    # flight-notifier below).
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/live').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  flight-notifier:
    build:
      context: .
      dockerfile: services/flight-notifier/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-identity_db}
      # Day 40: read by docker/postgres-init/01-create-booking-db.sh to
      # create api's own role, separate from identity's POSTGRES_USER above
      # — api's connection has no path to identity_db's tables.
      BOOKING_POSTGRES_USER: ${BOOKING_POSTGRES_USER:-booking}
      BOOKING_POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD:-booking_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rabbitmq_data:
  identity_postgres_data:
